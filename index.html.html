<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f1f0">
<title>Mon Quotidien</title>
<style>
:root{--bg:#f8f1f0;--paper:#fffdfc;--ink:#76545f;--muted:#9a858b;--rose:#eadce5;--line:#efe3e5;--lilac:#e9e6f2;--sage:#e7ebdf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:22px 18px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:3px 0 0;letter-spacing:-.7px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--muted)}.heart{background:var(--rose);border-radius:50%;width:45px;height:45px;display:grid;place-items:center;font-size:21px}
main{padding:0 14px 95px;max-width:680px;margin:auto}.card{background:var(--paper);border-radius:19px;padding:16px;margin:11px 0;box-shadow:0 2px 12px #7d58600a}.welcome{background:linear-gradient(135deg,#fffdfc,#f1e5e9)}.muted{color:var(--muted);font-size:13px}.section-title{font-size:18px;margin:18px 4px 8px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:var(--paper);border:0;border-radius:17px;padding:16px;text-align:left;color:var(--ink);font:inherit;min-height:94px}.tile .ico{font-size:22px;display:block;margin-bottom:9px}.tile b{font-size:14px}.pill{display:inline-block;background:var(--rose);padding:5px 9px;border-radius:30px;font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfcf2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 3px calc(9px + env(safe-area-inset-bottom));z-index:3}nav button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center}nav button span{font-size:19px}nav button.active{color:var(--ink);font-weight:700}
button,.btn{cursor:pointer}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:white;color:var(--ink);font:inherit;margin:5px 0 10px}textarea{min-height:70px}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--rose);color:var(--ink);font-weight:600}.btn.secondary{background:#f3edef}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.item:last-child{border:0}.item input[type=checkbox]{width:19px;margin:0}.small{font-size:12px;color:var(--muted)}.day{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.day strong{font-size:13px}.danger{color:#a35e70}.hidden{display:none!important}
</style>
</head>
<body>
<header><div><div class="eyebrow">MON PETIT ESPACE D’ORGANISATION</div><h1>Mon Quotidien</h1><div class="muted">Une journée à la fois 🌷</div></div><div class="heart">♡</div></header>
<main id="app"></main>
<nav id="nav">
<button data-page="home" class="active"><span>⌂</span>Accueil</button>
<button data-page="calendar"><span>▦</span>Agenda</button>
<button data-page="tasks"><span>✓</span>Maison</button>
<button data-page="shopping"><span>🛒</span>Courses</button>
<button data-page="more"><span>•••</span>Plus</button>
</nav>
<script>
const KEY='mon-quotidien-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[],shopping:[],appointments:[],transactions:[],notes:[]};
let page='home';
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function el(s){return document.querySelector(s)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function card(title,body){return `<section class="card"><b>${title}</b>${body}</section>`}
function home(){return `<section class="card welcome"><span class="pill">MON ESPACE</span><h2 style="margin:12px 0 4px">Bonjour 🌸</h2><div class="muted">Retrouve ici les petits repères de ton quotidien.</div></section><div class="section-title">Mes espaces</div><div class="tiles">
<button class="tile" onclick="setPage('calendar')"><span class="ico">🗓️</span><b>Calendrier</b></button>
<button class="tile" onclick="setPage('family')"><span class="ico">🤍</span><b>Famille</b></button>
<button class="tile" onclick="setPage('tasks')"><span class="ico">🏡</span><b>Maison & tâches</b></button>
<button class="tile" onclick="setPage('shopping')"><span class="ico">🛍️</span><b>Liste de courses</b></button>
<button class="tile" onclick="setPage('budget')"><span class="ico">💶</span><b>Budget</b></button>
<button class="tile" onclick="setPage('appointments')"><span class="ico">📅</span><b>Rendez-vous</b></button>
<button class="tile" onclick="setPage('private')"><span class="ico">🔒</span><b>Espace privé</b></button>
<button class="tile" onclick="setPage('sms')"><span class="ico">💬</span><b>Rappels SMS</b></button></div><div class="small" style="text-align:center;margin:17px">Prototype de départ — pense à conserver une sauvegarde de tes données.</div>`}
function calendar(){let days=[['Lundi','08 h 30 – 13 h 30'],['Mardi','09 h 30 – 18 h 15'],['Mercredi','09 h – 13 h 15'],['Jeudi','09 h 30 – 18 h 10'],['Vendredi','Pas de travail'],['Samedi','Un matin par mois selon le planning annuel'],['Dimanche','Repos']];return `<h2>Mon calendrier</h2><div class="row"><button class="btn" onclick="this.nextElementSibling.classList.add('hidden');this.parentElement.nextElementSibling.classList.remove('hidden')">Semaine</button><button class="btn secondary" onclick="alert('Vue mensuelle à compléter dans la prochaine version.')">Mois</button></div>${card('Mes horaires habituels',days.map(d=>`<div class="day"><strong>${d[0]}</strong><span class="muted">${d[1]}</span></div>`).join(''))}<p class="small">Les trajets de 25 minutes pourront être représentés sans alertes de départ ou de retour.</p>`}
function tasks(){return `<h2>Maison & tâches</h2>${card('Ajouter une tâche',`<form id="taskForm"><input name="name" placeholder="Ex. Nettoyer la salle de bain" required><div class="row"><select name="repeat"><option>Une fois</option><option>Chaque jour</option><option>Chaque semaine</option><option>Tous les 15 jours</option><option>Chaque mois</option></select><button class="btn">Ajouter</button></div></form>`)}${card('Ma liste',data.tasks.length?data.tasks.map((t,i)=>`<div class="item"><input type="checkbox" onchange="completeTask(${i},this.checked)"><div style="flex:1"><b>${safe(t.name)}</b><div class="small">${safe(t.repeat)} · ajoutée le ${t.created}</div></div><button class="btn secondary" onclick="removeItem('tasks',${i})">×</button></div>`).join(''):'<p class="muted">Aucune tâche pour le moment.</p>')}`}
function shopping(){return `<h2>Mes courses</h2>${card('Ajouter un article',`<form id="shopForm"><input name="name" placeholder="Produit" required><div class="row"><select name="category"><option>Alimentation</option><option>Hygiène</option><option>Entretien</option><option>Maison</option></select><input name="qty" placeholder="Quantité" value="1"></div><button class="btn">Ajouter à la liste</button></form>`)}${card('Ma liste',data.shopping.length?data.shopping.map((t,i)=>`<div class="item"><input type="checkbox" ${t.done?'checked':''} onchange="data.shopping[${i}].done=this.checked;save();render()"><div style="flex:1"><b style="${t.done?'text-decoration:line-through':''}">${safe(t.name)}</b><div class="small">${safe(t.category)} · ${safe(t.qty)}</div></div><button class="btn secondary" onclick="removeItem('shopping',${i})">×</button></div>`).join(''):'<p class="muted">Ta liste est vide.</p>'}<button class="btn secondary" onclick="data.shopping=data.shopping.filter(x=>!x.done);save();render()">Retirer les articles cochés</button>`)}`}
function family(){return `<h2>Organisation familiale</h2>${card('Repères habituels',`<p>• Un week-end sur deux chez son papa.</p><p>• Mardi soir : départ depuis l’école avec son papa.</p><p>• Mercredi : retour à 13 h 40.</p><p>• Vendredi avant un samedi travaillé : dépôt à 18 h ou après le football, selon ton choix pour chaque date.</p>`)}${card('À noter',`<p class="muted">Les dates particulières et les changements ponctuels pourront être ajoutés au calendrier. Les SMS programmés ouvriront un message prérempli à envoyer : l’envoi automatique en arrière-plan n’est pas garanti sur iPhone.</p>`)}`}
function appointments(){return `<h2>Mes rendez-vous</h2>${card('Ajouter un rendez-vous',`<form id="apptForm"><input name="title" placeholder="Nom du rendez-vous" required><div class="row"><input name="date" type="date" required><input name="time" type="time"></div><input name="address" placeholder="Adresse"><textarea name="notes" placeholder="Notes"></textarea><button class="btn">Enregistrer</button></form>`)}${card('À venir',data.appointments.length?data.appointments.map((a,i)=>`<div class="item"><div style="flex:1"><b>${safe(a.title)}</b><div class="small">${safe(a.date)} ${safe(a.time)} · ${safe(a.address)}</div></div><button class="btn secondary" onclick="removeItem('appointments',${i})">×</button></div>`).join(''):'<p class="muted">Aucun rendez-vous enregistré.</p>')}`}
function budget(){let sum=data.transactions.reduce((s,t)=>s+(t.type==='Revenu'?1:-1)*Number(t.amount),0);return `<h2>Mon budget</h2>${card('Solde des mouvements saisis',`<h2>${sum.toFixed(2).replace('.',',')} €</h2><div class="small">Calcul indicatif des seules opérations enregistrées ici.</div>`)}${card('Ajouter une opération',`<form id="moneyForm"><input name="label" placeholder="Libellé" required><div class="row"><select name="type"><option>Dépense</option><option>Revenu</option></select><input name="amount" type="number" min="0" step=".01" placeholder="Montant €" required></div><input name="date" type="date" required><button class="btn">Ajouter</button></form>`)}${card('Historique',data.transactions.length?data.transactions.map((t,i)=>`<div class="item"><div style="flex:1"><b>${safe(t.label)}</b><div class="small">${safe(t.type)} · ${safe(t.date)}</div></div><b>${Number(t.amount).toFixed(2)} €</b><button class="btn secondary" onclick="removeItem('transactions',${i})">×</button></div>`).join(''):'<p class="muted">Aucune opération.</p>')}`}
function privateArea(){return `<h2>Espace privé 🔒</h2>${card('Suivi personnel',`<p>Cette rubrique est réservée à tes informations privées.</p><p class="muted">Dans ce prototype, elle n’est PAS protégée par Face ID ni par un véritable verrouillage. N’y saisis pas de données médicales sensibles pour le moment.</p><p class="muted">La protection réelle nécessitera une application hébergée et une authentification sécurisée.</p>`)}`}
function sms(){return `<h2>Rappels SMS</h2>${card('Préparer un rappel',`<form id="smsForm"><input name="date" type="date" required><input name="time" type="time" required><input name="phone" type="tel" placeholder="Numéro du papa"><textarea name="message" placeholder="Ton message personnalisé" required></textarea><button class="btn">Créer un rappel (aperçu)</button></form><p class="small">Cette version ne programme pas l’envoi. Sur iPhone, le rappel final pourra déclencher une notification et ouvrir un SMS prérempli que tu valideras.</p>`)}`}
function more(){return `<h2>Autres rubriques</h2><div class="tiles"><button class="tile" onclick="setPage('family')">🤍<br><b>Famille</b></button><button class="tile" onclick="setPage('appointments')">📅<br><b>Rendez-vous</b></button><button class="tile" onclick="setPage('budget')">💶<br><b>Budget</b></button><button class="tile" onclick="setPage('private')">🔒<br><b>Espace privé</b></button><button class="tile" onclick="setPage('sms')">💬<br><b>Rappels SMS</b></button></div>${card('Données',`<button class="btn secondary" onclick="exportData()">Exporter une sauvegarde JSON</button><p class="small">Les informations de ce prototype restent dans le stockage local du navigateur de cet appareil. Elles ne sont pas synchronisées ni sauvegardées dans le cloud.</p>`)}`}
function render(){let views={home,calendar,tasks,shopping,family,appointments,budget,private:privateArea,sms,more};el('#app').innerHTML=views[page]();bindForms()}
function bindForms(){
let f=el('#taskForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=new FormData(f);data.tasks.push({name:x.get('name'),repeat:x.get('repeat'),created:new Date().toLocaleDateString('fr-FR')});save();render()};
f=el('#shopForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=new FormData(f);data.shopping.push({name:x.get('name'),category:x.get('category'),qty:x.get('qty'),done:false});save();render()};
f=el('#apptForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=new FormData(f);data.appointments.push(Object.fromEntries(x));save();render()};
f=el('#moneyForm');if(f)f.onsubmit=e=>{e.preventDefault();let x=new FormData(f);data.transactions.push(Object.fromEntries(x));save();render()};
f=el('#smsForm');if(f)f.onsubmit=e=>{e.preventDefault();alert('Aperçu seulement : le rappel n’est pas encore programmé.');};
}
function completeTask(i,checked){if(checked){data.tasks[i].completed=new Date().toLocaleDateString('fr-FR');data.tasks[i].history=(data.tasks[i].history||[]).concat(data.tasks[i].completed);data.tasks.splice(i,1)}save();render()}
function removeItem(k,i){data[k].splice(i,1);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mon-quotidien-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
render();
</script>
</body></html>
